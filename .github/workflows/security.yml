name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "29 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulnerability-scan:
    name: Scan Go dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true
      - name: Scan dependencies
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.27.x"
          go-package: ./...
